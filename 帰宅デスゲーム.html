function zone(key,x,z){const d=Z[key],hole=key==='hole';
 const ring=new T.Mesh(new T.CircleGeometry(d.r,28),new T.MeshBasicMaterial({color:hole?0x0a0a0a:0xff3344,transparent:true,opacity:.5,depthWrite:false}));ring.rotation.x=-Math.PI/2;ring.position.set(x,.06,z);scene.add(ring);
 let o=null;if(key==='bolt'){o=new T.Mesh(new T.CylinderGeometry(.6,.6,80,8),bas(d.c));o.position.set(x,40,z);o.visible=false}else if(!hole){o=new T.Mesh(key==='pot'?new T.CylinderGeometry(.4,.3,.6,10):new T.SphereGeometry(key==='bird'?.18:1.6,12,10),key==='meteor'?bas(d.c):mat(d.c));o.castShadow=true}
 if(o)scene.add(o);let t=0,hit=false;toast(d.msg);sfx(d.s[0]);
 H.push({z,ms:[ring,o].filter(Boolean),u(dt){t+=dt;const f=Math.min(t/d.w,1);
  if(!hit){ring.scale.setScalar(.3+.7*f);ring.material.opacity=.3+.2*Math.sin(t*18)+.3*f;if(o&&key!=='bolt')o.position.set(x,.3+(1-f)*(1-f)*18,z)}
  if(!hit&&t>=d.w){hit=true;shake=key==='meteor'?1.2:.4;sfx(d.s[1]);if(key==='meteor')flash(.8,500);if(hole){ring.material.opacity=1;ring.scale.setScalar(1)}else ring.material.opacity=0;if(key==='bolt')o.visible=true;if(key==='meteor')o.visible=false}
  if(hit&&Math.hypot(p.x-x,p.z-z)<d.r+.15&&(hole?py<.5:t-d.w<.4))die(P(d.cause));
  if(hit&&!hole&&t>d.w+.5)return false}})}
function cross(key){const d=CR[key],dir=P([-1,1]),z=p.z-R(18,28),g=d.mk();g.position.set(-dir*(d.l/2+40),0,z);if(d.an)g.rotation.y=-dir*Math.PI/2;else if(dir<0)g.rotation.y=Math.PI;scene.add(g);
 const wn=new T.Mesh(new T.PlaneGeometry(80,d.w+.8),new T.MeshBasicMaterial({color:0xff3344,transparent:true,opacity:.25,depthWrite:false}));wn.rotation.x=-Math.PI/2;wn.position.set(0,.05,z);scene.add(wn);toast(d.msg);sfx(d.sf);let t=0;
 H.push({z,ms:[g,wn],u(dt){t+=dt;g.position.x+=dir*d.v*dt;wn.material.opacity=.15+.12*Math.sin(t*12);
  if(d.an){const s=Math.sin(t*d.v*.8);g.userData.L.forEach((m,i)=>m.rotation.x=(i%2?-s:s)*.8);if(t%2<dt)sfx(d.sf)}
  if(Math.abs(g.position.x-p.x)<d.l/2+.35&&Math.abs(z-p.z)<d.w/2+.35&&py<(d.jh||9))die(P(d.cause));if(Math.abs(g.position.x)>d.l/2+45)return false}})}
function chase(key){const o=CH[key];toast(o.msg);for(let i=0;i<(o.n||1);i++){const g=o.mk();g.position.set(cl(p.x+R(-6,6),-7,7),0,p.z-R(38,46)-i*3);scene.add(g);let t=R(0,3),ts=0,ph=R(0,6);if(!i)sfx(o.sf);
 H.push({z:g.position.z,ms:[g],u(dt){t+=dt;ts-=dt;this.z=g.position.z;const dx=p.x-g.position.x+(o.wob?Math.sin(t*6+ph)*o.wob:0),dz=p.z-g.position.z,l=Math.hypot(dx,dz)||1;
  g.position.x+=dx/l*o.v*dt;g.position.z+=dz/l*o.v*dt;g.rotation.y=Math.atan2(-dx,-dz);const s=Math.sin(t*o.v*1.4),u=g.userData;
  u.L&&u.L.forEach((m,i)=>m.rotation.x=(i%2?-s:s)*.8);if(u.kn)u.A.forEach((m,i)=>m.rotation.x=-2.4+Math.sin(t*16+i*2)*.7);g.position.y=Math.abs(s)*.1;
  if(ts<=0){ts=o.sfi;sfx(o.sf)}if(l<o.r&&py<1)die(P(o.cause));if(t>o.life||l>100)return false}})}}
function lane(o){const z=o.z,s=o.s,ln=new T.Mesh(new T.PlaneGeometry(18,.2),new T.MeshBasicMaterial({color:o.wc||0xff3344,transparent:true,opacity:.6,depthWrite:false}));ln.rotation.x=-Math.PI/2;ln.position.set(0,.06,z);scene.add(ln);
 const em=box(.6,.6,.6,bas(0xffe066),s*9.5,o.y,z,scene,false),ms=[ln,em],bl=[];let t=0,n=0;
 H.push({z,ms,u(dt){t+=dt;em.visible=Math.sin(t*30)>0;if(t>o.d+n*o.g&&n<o.n){const b=o.mk();b.position.set(s*9,o.y,z);scene.add(b);bl.push(b);ms.push(b);n++;o.sf&&sfx(o.sf)}
  for(const b of bl){b.position.x-=s*o.v*dt;const top=py+2*(1-.55*crouch);if(Math.abs(b.position.x-p.x)<o.hw&&Math.abs(z-p.z)<.55&&o.y+o.sy/2>py&&o.y-o.sy/2<top)die(P(o.cause))}
  if(t>o.d+o.n*o.g+1.2)return false}})}
const BU=()=>box(1.8,.12,.12,bas(0xfff2a0),0,0,0,scene,false);
function gun(){lane({z:p.z-R(14,22),s:P([-1,1]),y:P([1.15,.35]),n:4,g:.25,d:1.1,v:50,hw:1.3,sy:.12,mk:BU,sf:'gun',cause:GUNC});toast('銃声!?伏せろ/跳べ!');sfx('warn')}
function crow(){lane({z:p.z-R(14,22),s:P([-1,1]),y:1.3,n:1,g:1,d:1,v:22,hw:3,sy:.9,wc:0x333333,sf:'caw',cause:CROWC,mk:()=>{const g=new T.Group();for(let i=0;i<9;i++)box(.5,.12,.3,0x0a0a0a,R(-2.5,2.5),R(-.3,.3),R(-.6,.6),g,false);return g}});toast('カラスの大群!伏せろ!')}
function shoot(){const z=p.z-R(22,30);toast('警察と強盗が銃撃戦をしている!!');sfx('siren');
 const pc=mkCar(4.6,1.5,1.9,0xf0f0f0,1),rc=mkCar(4.4,1.45,1.9,0x222222);pc.position.set(10.8,0,z-6);pc.rotation.y=Math.PI/2;rc.position.set(-10.8,0,z+4);rc.rotation.y=-Math.PI/2;scene.add(pc,rc);
 const a=mkP(0x1a2a5a,0xf2c9a0),b=mkP(0x222222,0xf2c9a0);a.position.set(8.8,0,z-6);b.position.set(-8.8,0,z+4);scene.add(a,b);
 for(let i=0;i<9;i++)lane({z:z-R(0,10),s:i%2?1:-1,y:P([1.15,.35,.35]),n:2,g:.3,d:1+i*.35,v:42,hw:1.3,sy:.12,mk:BU,sf:'gun',cause:SHC});
 let t=0;H.push({z,ms:[pc,rc,a,b],u(dt){t+=dt;const s=pc.userData.sir;s[0].visible=Math.sin(t*14)>0;s[1].visible=!s[0].visible;if(Math.floor(t*2.5)!==Math.floor((t-dt)*2.5))sfx('siren');if(t>9)return false}})}
function banana(){for(let i=0;i<3;i++){const x=cl(p.x+R(-2.5,2.5),-7,7),z=p.z-R(14,24)-i*5,g=new T.Group();box(.5,.12,.2,0xffd21e,0,.08,0,g).rotation.z=.2;box(.3,.1,.18,0xe8b800,.3,.14,0,g).rotation.z=.6;
 const r=new T.Mesh(new T.CircleGeometry(.9,16),new T.MeshBasicMaterial({color:0xffe14a,transparent:true,opacity:.3,depthWrite:false}));r.rotation.x=-Math.PI/2;r.position.y=.05;g.add(r);g.position.set(x,0,z);g.rotation.y=R(0,6);scene.add(g);
 H.push({z,ms:[g],u(){if(Math.abs(p.x-x)<.8&&Math.abs(p.z-z)<.65&&py<.45){sfx('slip');die(BANC)}}})}toast('バナナの皮が落ちてる!跳べ!');sfx('warn')}
function spawn(k){if(Z[k]){const d=Z[k];zone(k,cl(p.x+R(-.7,.7),-7,7),p.z-vz*d.w+R(-.6,.6))}else if(CR[k])cross(k);else if(CH[k])chase(k);else({gun,shoot,crow,banana})[k]()}
const POOL=[[0,'bird','sedan','pot','banana'],[.08,'hole','gun','dog','crow'],[.18,'bull','knife','suv','truck'],[.33,'lion','shoot','bike'],[.48,'bolt','zombie','bear'],[.62,'meteor','ele']];
function direct(dt){const pr=p.z/GOAL;idle=vz<.5?idle+dt:0;if(p.z>next&&idle<3.5)return;idle=0;const pool=POOL.filter(a=>pr>=a[0]).flatMap(a=>a.slice(1));
 let n=1+(Math.random()<.25+pr*.6)+(pr>.5&&Math.random()<.4);while(n--)spawn(P(pool));next=p.z-Math.max(5,13-pr*9)-R(0,3)}
// ---- 進行 ----
function upd(dt){
 const fw=k.KeyW||k.ArrowUp||joy.y<-.35,dx=cl((k.KeyD||k.ArrowRight?1:0)-(k.KeyA||k.ArrowLeft?1:0)+(Math.abs(joy.x)>.25?joy.x:0),-1,1);
 const cr=k.KeyS||k.ArrowDown||k.ControlLeft||k.KeyC||hc,mv=fw||dx,ds=(k.ShiftLeft||k.ShiftRight||hd1)&&stam>1&&!cr&&mv;
 if((k.Space||hj)&&py===0&&!cr){vy=11;sfx('jump')}vy-=32*dt;py=Math.max(0,py+vy*dt);if(py===0)vy=0;
 crouch+=((cr?1:0)-crouch)*Math.min(1,dt*14);const sp=(ds?13:7.5)*(1-.55*crouch);stam=cl(stam+(ds?-30:16)*dt,0,100);
 vz=fw?sp:0;p.z-=vz*dt;p.x=cl(p.x+dx*sp*.8*dt,-7.3,7.3);
 pl.position.set(p.x,py+(py?0:Math.abs(Math.sin(ph))*.06),p.z);pl.rotation.y+=(-dx*.5-pl.rotation.y)*Math.min(1,dt*10);pl.scale.y=1-.55*crouch;
 ph+=dt*(mv?(ds?18:12):0);lL.rotation.x=Math.sin(ph)*.8;lR.rotation.x=-lL.rotation.x;
 cam.fov+=((ds?74:62)-cam.fov)*Math.min(1,dt*6);cam.updateProjectionMatrix();direct(dt);
 for(let i=H.length-1;i>=0;i--){const h=H[i];if(st!=='play')break;if(h.u(dt)===false||h.z-p.z>30){h.ms.forEach(m=>scene.remove(m));H.splice(i,1)}}
 $('dist').textContent=Math.max(0,Math.round(p.z-GOAL-1));$('sf').style.width=stam+'%';if(st==='play'&&p.z<GOAL+1)win()}
function camup(){const j=shake*(Math.random()-.5);cam.position.set(p.x*.8+j,3.8-crouch*.5+py*.4+j,p.z+7.8);cam.lookAt(p.x*.9,1.4,p.z-7);sun.position.set(p.x+10,28,p.z+8);sun.target.position.set(p.x,0,p.z-8)}
function die(c){if(st!=='play')return;st='dead';deaths++;lastC=c;shake=.9;sfx('die');const nw=!fnd.includes(c);if(nw){fnd.push(c);try{localStorage.setItem('hdg2',JSON.stringify(fnd))}catch(e){}}
 $('cause').textContent='死因:'+c;$('new').hidden=!nw;$('cnt').textContent=fnd.length+' / '+ALL.length;flash(.9,300);setTimeout(()=>{if(st==='dead')$('dead').classList.add('on')},700)}
function win(){st='win';sfx('win');$('wt').textContent='所要時間 '+((performance.now()-t0)/1000).toFixed(1)+'秒 ・ 死んだ回数 '+deaths+'回 ・ 図鑑 '+fnd.length+'/'+ALL.length;$('win').classList.add('on')}
function start(){H.forEach(h=>h.ms.forEach(m=>scene.remove(m)));H=[];p={x:0,z:14};next=p.z-12;idle=0;vz=0;py=0;vy=0;stam=100;crouch=0;shake=0;t0=performance.now();st='play';AC();
 ['start','dead','win'].forEach(i=>$(i).classList.remove('on'));$('book').hidden=true}
function book(){const b=$('book');b.innerHTML='';ALL.forEach(c=>{const li=document.createElement('li');li.textContent=fnd.includes(c)?'☠ '+c:'？？？？？';b.appendChild(li)});b.hidden=!b.hidden}
['go','r1','r2'].forEach(i=>$(i).onclick=start);$('bk').onclick=$('bk2').onclick=book;
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText('帰宅デスゲームで「'+lastC+'」で死んだ。 '+location.href);toast('コピーした!友達に送ろう')}catch(e){toast('コピーできなかった')}};
addEventListener('keydown',e=>{k[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Enter'&&st!=='play')start()});
addEventListener('keyup',e=>k[e.code]=0);addEventListener('blur',()=>k={});
const cv=$('c');let tx=0,ty=0;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchmove',e=>{joy.x=cl((e.touches[0].clientX-tx)/40,-1,1);joy.y=cl((e.touches[0].clientY-ty)/40,-1,1)},{passive:true});
cv.addEventListener('touchend',()=>{joy.x=joy.y=0});
const hold=(id,f)=>{const e=$(id);e.addEventListener('pointerdown',()=>f(true));['pointerup','pointerleave','pointercancel'].forEach(n=>e.addEventListener(n,()=>f(false)))};
hold('bdash',v=>hd1=v);hold('bcrch',v=>hc=v);hold('bjump',v=>hj=v);
function rs(){ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min((n-last)/1000,.05);last=n;if(st==='play')upd(dt);else if(st==='menu')p.x=Math.sin(n/1500)*3;shake*=.9;camup();ren.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
